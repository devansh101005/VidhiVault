version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: adhivakta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhivakta
      POSTGRES_PASSWORD: adhivakta_dev
      POSTGRES_DB: adhivakta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adhivakta_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: